[DEFAULT]
# yoyo configuration for phangan_api migrations.
# Connection string is provided via DATABASE_URL env var or --database flag.
# Example:
#   DATABASE_URL=postgresql://user:pass@localhost:5432/ThaiApp
#   yoyo apply --database "$DATABASE_URL" ./migrations
#
# We keep the yoyo-managed migration log in the table _yoyo_migration
# (default name). Do NOT rename it — yoyo treats it as the source of truth.

batch_mode = on
verbosity = 1
migration_table = _yoyo_migration
